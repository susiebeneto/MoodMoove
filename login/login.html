<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in · MoodMove</title>
  <link rel="stylesheet" type="text/css" href="css/styles.css" />
</head>
<body>
  <!-- Logo -->
  <h1 class="logo">MoodMove</h1>

  <!-- Navigation menu -->
  <p class="menu">
    <a href="index.html">Home</a> |
    <a href="about.html">About</a> |
    <a href="login.html">Log in</a> |
    <a href="register.html">Register</a>
  </p>

  <!-- Dark mode toggle -->
  <p class="theme-toggle-wrap">
    <button id="theme_toggler" type="button">🌙 Dark mode</button>
  </p>

  <h2>Welcome back</h2>

  <!-- Filled in by js/forms.js -->
  <div id="message"></div>

  <form id="login_form" class="form-box" action="/login" method="post">
    <label for="who">Username</label>
    <input type="text" name="username" id="who" required />

    <label for="pw">Password</label>
    <input type="password" name="password" id="pw" required />

    <input type="submit" class="btn" value="Log in" />
  </form>

  <p class="menu">New here? <a href="register.html">Create an account</a></p>

  <script src="js/theme.js"></script>
  <script src="js/forms.js"></script>
</body>
</html>
